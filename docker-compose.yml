services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rahal
      POSTGRES_USER: rahal
      POSTGRES_PASSWORD: rahal_dev_password
    ports:
      - "5433:5432"
    volumes:
      - rahal_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahal -d rahal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rahal_postgres:
