name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rahal_ci
          POSTGRES_USER: rahal_ci
          POSTGRES_PASSWORD: rahal_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rahal_ci -d rahal_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://rahal_ci:rahal_ci_password@127.0.0.1:5432/rahal_ci?schema=public
      WEB_URL: http://localhost:3000
      AUTH_SECRET: rahal-ci-auth-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:audit:test
      - name: Enforce dependency security policy
        run: pnpm security:audit
      - name: Upload complete dependency audit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: .security-audit-reports
          retention-days: 30
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          RAHAL_E2E_DATABASE_URL: postgresql://rahal_ci:rahal_ci_password@127.0.0.1:5432/rahal_ci?schema=public
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
